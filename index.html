<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareBuddy – Health Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fdf3f7;--card:#fff;--ink:#2b1a23;--mute:#7d6672;--brand:#c9206a;--brand2:#e0457f;--soft:#fce7f0;--line:#f0d5e0;--user:#c9206a;--userink:#fff;--warn:#fff7ec;--warnink:#7a4a10;--alert:#fdecec;--alertink:#a11a1a;--shadow:0 1px 2px rgba(120,20,60,.06),0 8px 24px rgba(201,32,106,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#0c0c0c;--ink:#ededed;--mute:#8f8f8f;--brand:#e0457f;--brand2:#f06292;--soft:#1a1017;--line:#212121;--user:#c2185b;--warn:#140e05;--warnink:#e8c48a;--alert:#1c0808;--alertink:#ff9c9c;--shadow:none}}
:root[data-theme="dark"]{--bg:#000;--card:#0c0c0c;--ink:#ededed;--mute:#8f8f8f;--brand:#e0457f;--brand2:#f06292;--soft:#1a1017;--line:#212121;--user:#c2185b;--warn:#140e05;--warnink:#e8c48a;--alert:#1c0808;--alertink:#ff9c9c;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;display:flex;justify-content:center;transition:background .3s,color .3s}
.app{width:100%;max-width:780px;height:100%;display:flex;flex-direction:column;padding:12px}
header{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.logo{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.logo img{height:34px;width:auto;display:block}
header h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
header small{color:var(--mute);display:flex;align-items:center;gap:6px;font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.sp{flex:1}
button{font:inherit;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;width:38px;height:38px;display:grid;place-items:center;transition:.2s}
.ib:hover{border-color:var(--brand);color:var(--brand)}
svg{display:block}
.note{margin:10px 0 0;background:var(--warn);color:var(--warnink);border-left:3px solid var(--warnink);border-radius:8px;padding:8px 12px;font-size:12.5px}
#chat{flex:1;overflow-y:auto;padding:16px 2px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.row{display:flex;gap:10px;animation:in .25s ease}
.row.u{justify-content:flex-end}
.av{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none}
.av img{height:22px;width:auto}
.col{display:flex;flex-direction:column;max-width:84%;gap:3px}
.u .col{align-items:flex-end}
.b{padding:11px 15px;border-radius:16px;overflow-wrap:anywhere}
.bot .b{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;box-shadow:var(--shadow)}
.u .b{background:var(--user);color:var(--userink);border-top-right-radius:4px;white-space:pre-wrap}
.ts{font-size:11px;color:var(--mute);padding:0 4px}
.b ul{margin:6px 0 4px;padding-left:20px}.b li{margin:2px 0}.b p{margin:0 0 7px}.b p:last-child{margin:0}
.b.em{background:var(--alert);color:var(--alertink);border-color:var(--alertink)}
.tag{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;background:var(--soft);color:var(--brand);border-radius:6px;padding:2px 8px;margin-bottom:7px}
.em .tag{background:var(--alertink);color:var(--alert)}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--brand);animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;transition:.2s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.bar{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);transition:.2s}
.bar:focus-within{border-color:var(--brand)}
#in{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;min-width:0;padding:8px 0}
#in::placeholder{color:var(--mute)}
#send{border:0;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:#fff;background:var(--brand)}
#send:hover{background:var(--brand2)}#send:disabled{opacity:.45;cursor:default}
</style>
</head>

{t:"Headache",k:["headache","migraine","head hurts","head pain"],a:"<p>Most headaches are tension-type or related to dehydration, poor sleep or screen strain.</p><ul><li>Drink water and rest in a quiet, dim room</li><li>Try a cool or warm compress on the forehead or neck</li><li>Gentle neck stretches, and screen breaks</li><li>Over-the-counter pain relief can help if it's suitable for you — follow the label</li></ul><p><b>Get urgent care</b> for a sudden 'worst ever' headache, headache with fever and stiff neck, confusion, weakness, or after a head injury.</p>"},
{t:"Fever",k:["fever","temperature","feverish","high temp"],a:"<p>Fever is often the body fighting an infection.</p><ul><li>Rest and drink plenty of fluids</li><li>Wear light clothing; keep the room comfortably cool</li><li>Paracetamol can help comfort — follow the label or your doctor's dose</li></ul><p><b>Seek medical care</b> if fever is above 39.5°C (103°F), lasts more than 3 days, or comes with rash, breathing trouble, confusion or severe pain. Any fever in a baby under 3 months needs prompt care.</p>"},
{t:"Cold, cough & flu",k:["cold","cough","runny nose","flu","congestion","sneez","blocked nose"],a:"<p>Colds and flu are usually viral and improve in 7–10 days.</p><ul><li>Rest, fluids, warm soups or herbal teas</li><li>Saline nasal rinse or steam inhalation for a blocked nose</li><li>Honey (not for children under 1) can soothe a cough</li><li>Wash hands often and stay home to avoid spreading it</li></ul>"+SEE},
{t:"Sore throat",k:["sore throat","throat","tonsil"],a:"<ul><li>Gargle with warm salt water a few times a day</li><li>Warm fluids, honey-lemon water, throat lozenges</li><li>Rest your voice and stay hydrated</li></ul><p>Difficulty swallowing or breathing, drooling, or a sore throat lasting over a week needs a doctor's review.</p>"},
{t:"Stomach & digestion",k:["stomach","diarrhea","diarrhoea","vomit","nausea","indigestion","acidity","loose motion","constipation","bloat","gas"],a:"<ul><li>Sip water or oral rehydration solution often, in small amounts</li><li>Eat bland foods (rice, banana, toast, curd) once nausea settles</li><li>Avoid oily, spicy food, alcohol and caffeine for now</li><li>For constipation: more fibre, water and daily walking</li></ul><p><b>Seek care</b> for blood in stool or vomit, severe belly pain, signs of dehydration (very dark urine, dizziness), or symptoms beyond 2 days.</p>"},
{t:"Body & joint pain",k:["back pain","backache","neck pain","muscle","joint","knee","shoulder pain"],a:"<ul><li>Stay gently active — long bed rest usually slows recovery</li><li>Heat for stiffness, cold packs for fresh swelling (15 min at a time)</li><li>Check your posture and desk setup; stretch every hour</li></ul><p>See a doctor for numbness, leg weakness, pain after a fall, or pain that doesn't ease within a couple of weeks.</p>"},
{t:"Injuries, cuts & burns",k:["sprain","twist","cut","wound","burn","bruise","scald","fracture"],a:"<ul><li><b>Cuts:</b> wash hands, press with clean cloth to stop bleeding, rinse with clean water, cover</li><li><b>Burns:</b> cool under running water for 20 minutes; don't use ice, butter or toothpaste</li><li><b>Sprains:</b> Rest, Ice, Compression, Elevation</li></ul><p>Get medical care for deep or dirty wounds, large or facial burns, or if you can't bear weight on a limb.</p>"},
{t:"Skin & allergies",k:["rash","allergy","allergic","itch","hives","pimple","acne","eczema"],a:"<ul><li>Avoid scratching; use a cool compress and fragrance-free moisturiser</li><li>Note possible triggers (foods, soaps, medicines, pollen)</li><li>Antihistamines may help mild allergies — check with a pharmacist</li></ul><p><b>Emergency</b> if there's lip/tongue swelling or trouble breathing. See a doctor for spreading, painful or persistent rashes.</p>"},
{t:"Sleep & fatigue",k:["sleep","insomnia","tired","fatigue","exhausted"],a:"<ul><li>Keep a fixed sleep and wake time, even on weekends</li><li>No screens or caffeine 1–2 hours before bed</li><li>Keep the room dark, cool and quiet</li><li>Get morning daylight and some daily movement</li></ul><p>Most adults need 7–9 hours. Ongoing tiredness despite good sleep is worth a check-up (iron, thyroid, vitamin levels, mood).</p>"},
{t:"Stress & mental wellbeing",k:["stress","anxiety","anxious","panic","sad","depress","low mood","worried","lonely","overwhelmed"],a:"<p>I'm sorry you're dealing with this — your feelings are valid.</p><ul><li>Slow breathing: in for 4, hold 4, out for 6, for a few minutes</li><li>Take a short walk, and write down what's on your mind</li><li>Talk with someone you trust</li><li>Limit caffeine and late-night scrolling</li></ul><p>If it lasts for weeks or affects daily life, a counsellor or doctor can really help.</p>"},
{t:"Nutrition & weight",k:["diet","nutrition","eat","weight","food","protein","vitamin"],a:"<ul><li>Fill half your plate with vegetables and fruit</li><li>Choose whole grains, pulses, nuts and lean protein</li><li>Limit sugary drinks and ultra-processed snacks</li><li>Eat regular meals; go easy on salt</li></ul><p>For a personal plan or medical conditions, a registered dietitian is best. You can also type e.g. <i>BMI 65 kg 170 cm</i>.</p>"},
{t:"Exercise",k:["exercise","workout","fitness","walk","gym","yoga"],a:"<ul><li>Aim for 150 minutes of moderate activity a week (like brisk walking)</li><li>Add strength training twice a week</li><li>Start small and build up; warm up and cool down</li></ul><p>If you have heart, joint or other conditions, check with your doctor first.</p>"},
{t:"Hydration",k:["water","hydrat","dehydr","thirst"],a:"<p>Many adults do well with roughly 2–3 litres of fluids a day, more in heat or exercise.</p><ul><li>Pale-yellow urine is a good sign</li><li>Dark urine, dizziness, dry mouth = drink more</li></ul>"},
{t:"Blood pressure & sugar",k:["blood pressure","bp","sugar","diabetes","cholesterol","hypertension"],a:"<ul><li>Normal BP is generally around 120/80 mmHg</li><li>Reduce salt, stay active, manage weight and stress, avoid smoking</li><li>For diabetes: regular meals, fibre-rich carbs, activity and prescribed medicines/monitoring</li></ul><p>Never change prescribed medicines on your own — talk with your doctor about your readings.</p>"},
{t:"Medicines",k:["medicine","medication","dose","dosage","paracetamol","ibuprofen","antibiotic","tablet","pill"],a:"<ul><li>Take medicines exactly as prescribed or as the label says</li><li>Finish antibiotics only when prescribed; never use leftovers</li><li>Check with a pharmacist about interactions, pregnancy or allergies</li><li>Keep medicines away from children</li></ul><p>I can't recommend specific doses — please ask your doctor or pharmacist.</p>"}
];
const EMERG=/chest (pain|tight|pressure)|can'?t breathe|cannot breathe|difficulty breathing|trouble breathing|shortness of breath|stroke|face droop|slurred|unconscious|passed out|seizure|severe bleeding|won'?t stop bleeding|overdose|poison|heart attack|anaphyla|swollen (tongue|lips)|coughing blood|vomiting blood/i;
const CRISIS=/suicid|kill myself|end my life|want to die|self.?harm|hurt myself/i;
const esc=k=>new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");
KB.forEach(e=>e.r=e.k.map(esc));
function respond(text){
  const q=text.trim();
  if(CRISIS.test(q))return{em:1,html:"<p><b>You matter, and you don't have to face this alone.</b></p><p>Please reach out right now to your local emergency number or a crisis helpline in your country, or go to the nearest emergency room. If you can, tell a trusted person near you so you're not alone.</p><p>I'm here to keep talking with you too.</p>"};
  if(EMERG.test(q))return{em:1,html:"<p><b>This could be a medical emergency.</b></p><p>Call your local emergency number (e.g. 112 / 911 / 999) or go to the nearest emergency room <b>now</b>. Don't drive yourself. Stay calm, sit or lie comfortably, and keep someone with you until help arrives.</p>"};
  const m=q.match(/(\d+(?:\.\d+)?)\s*kg\D{0,20}?(\d+(?:\.\d+)?)\s*(cm|m)\b/i);
  if(/bmi/i.test(q)&&m){let h=+m[2];if(m[3].toLowerCase()==="cm")h/=100;const b=+m[1]/(h*h);
    const c=b<18.5?"underweight":b<25?"in the healthy range":b<30?"overweight":"in the obesity range";
    return{t:"BMI",html:`<p>Your BMI is <b>${b.toFixed(1)}</b>, which is ${c}.</p><p>BMI is only a rough guide — it doesn't account for muscle, age or body type.</p>`};}
  if(/bmi/i.test(q))return{t:"BMI",html:"<p>Send your weight and height like: <i>BMI 65 kg 170 cm</i>.</p>"};
  if(/^(hi|hello|hey|hii|good (morning|afternoon|evening)|namaste)\b/i.test(q))return{html:"<p>Hello! I'm CareBuddy. Tell me how you're feeling, or pick a topic below.</p>"};
  if(/\b(thanks|thank you|thx)\b/i.test(q))return{html:"<p>You're welcome! Take care of yourself</p>"};
  if(/\b(who are you|what can you do|help)\b/i.test(q))return{html:"<p>I share general health information on symptoms, first aid, nutrition, sleep, stress and more. I can't diagnose or prescribe — for that, please see a healthcare professional.</p>"};
  let best=null,bs=0;
  for(const e of KB){const s=e.r.filter(r=>r.test(q)).length;if(s>bs){bs=s;best=e;}}
  if(best)return{t:best.t,html:best.a};
  return{html:"<p>I'm not sure I understood. Could you describe the symptom, how long you've had it, and how severe it is? You can also try a topic like <i>fever</i>, <i>headache</i>, <i>sleep</i> or <i>stress</i>.</p>"};
}
if(typeof module!=="undefined")module.exports={respond};
</script>

<script>
const $=id=>document.getElementById(id),chat=$("chat"),inp=$("in"),send=$("send"),LOGO=document.querySelector(".logo img").src;
const CHIPS=["I have a fever","Headache","Cold & cough","Upset stomach","Sleep tips","Feeling stressed","Healthy eating","BMI 65 kg 170 cm"];
const IC={moon:`<svg viewBox='0 0 24 24' width='18' height='18' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`,sun:`<svg viewBox='0 0 24 24' width='18' height='18' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`};
function add(cls,html,em,tag,noTs){
  const r=document.createElement("div");r.className="row "+cls;
  if(cls==="bot"){const a=document.createElement("div");a.className="av";a.innerHTML='<img alt="">';a.firstChild.src=LOGO;r.appendChild(a)}
  const c=document.createElement("div");c.className="col";
  const b=document.createElement("div");b.className="b"+(em?" em":"");
  if(cls==="u")b.textContent=html;else b.innerHTML=(tag?`<span class="tag">${tag}</span>`:"")+html;
  c.appendChild(b);
  if(!noTs){const t=document.createElement("div");t.className="ts";t.textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});c.appendChild(t)}
  r.appendChild(c);chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r;
}
function ask(text){
  text=(text||"").trim();
  if(!text||send.disabled)return;
  add("u",text);inp.value="";send.disabled=true;
  const t=add("bot",'<span class="typing"><span></span><span></span><span></span></span>',0,"",1);
  setTimeout(()=>{t.remove();const r=respond(text);add("bot",r.html,r.em,r.em?"Urgent":r.t);send.disabled=false;inp.focus()},600+Math.random()*400);
}
function start(){chat.innerHTML="";add("bot","<p>Hello, I'm <b>CareBuddy</b>, your virtual health information assistant.</p><p>Tell me your symptoms or ask a wellness question. I can't diagnose, but I can share reliable general guidance and tell you when to seek care.</p>")}
$("chips").innerHTML=CHIPS.map(c=>`<button class="chip">${c}</button>`).join("");
$("chips").addEventListener("click",e=>{if(e.target.classList.contains("chip"))ask(e.target.textContent)});
send.onclick=()=>ask(inp.value);
inp.addEventListener("keydown",e=>{if(e.key==="Enter")ask(inp.value)});
$("clear").onclick=start;
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("theme").innerHTML=t==="dark"?IC.sun:IC.moon}
let th=null;try{th=localStorage.getItem("cb-theme")}catch(e){}
if(!th)th=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
applyTheme(th);
$("theme").onclick=()=>{th=th==="dark"?"light":"dark";applyTheme(th);try{localStorage.setItem("cb-theme",th)}catch(e){}};
start();
</script>
